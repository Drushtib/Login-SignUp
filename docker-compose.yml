services:

  mysql:
    image: mysql:8
    container_name: mysql-container
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth_db

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql


  backend:
    build: ./backend
    image: drushtibothikar/login-signup-backend:latest
    container_name: backend-container

    ports:
      - "5000:5000"

    depends_on:
      - mysql

    environment:
      DB_HOST: mysql


  frontend:
    build: ./login-signup
    image: drushtibothikar/login-signup-frontend:latest
    container_name: frontend-container

    ports:
      - "3000:3000"

    depends_on:
      - backend


volumes:
  mysql-data: